##### Terminal
# Enable terminal capabilities
set -as terminal-features ",*:RGB"

# Misc
set -g history-limit 500000

# Faster ESC response
set -sg escape-time 10

# Start numbering at 1
set -g base-index 1
set -g pane-base-index 1

# Renumber windows automatically
set -g renumber-windows on

# Watch for activity in background windows
setw -g monitor-activity on

##### Prefix

unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### Mouse

set -g mouse on

# Vi keys in copy mode
setw -g mode-keys vi

# Focus events for editors and shells
set -g focus-events on

##### Clipboard

# Let tmux use OSC 52 clipboard integration when supported.
set -g set-clipboard on

##### Splits

unbind %
unbind '"'

bind '\' split-window -h -c "#{pane_current_path}"  # Fix '
bind '-' split-window -v -c "#{pane_current_path}"

##### New windows inherit cwd

bind c new-window -c "#{pane_current_path}"

##### Window navigation

bind-key -n M-n new-window -c "#{pane_current_path}"

bind-key -n M-1 select-window -t :1
bind-key -n M-2 select-window -t :2
bind-key -n M-3 select-window -t :3
bind-key -n M-4 select-window -t :4
bind-key -n M-5 select-window -t :5
bind-key -n M-6 select-window -t :6
bind-key -n M-7 select-window -t :7
bind-key -n M-8 select-window -t :8
bind-key -n M-9 select-window -t :9

bind-key -n M-, select-window -p
bind-key -n M-. select-window -n

bind-key -n M-< swap-window -t -1
bind-key -n M-> swap-window -t +1

bind-key -n M-X confirm-before -p "Kill window? (y/n)" kill-window

##### Status Bar

set -g status-position bottom

set -g status-style "fg=white,bg=default"

setw -g window-status-style "fg=colour244,bg=default"

setw -g window-status-current-style \
    "fg=colour231,bg=colour160,bold"

set -g status-justify centre

##### Quality of Life

# Easier pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### Reload config

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
